<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Elsewhen logo</title>
  <desc id="desc">A minimal temporal loop mark with an offset point, paired with the Elsewhen wordmark.</desc>
  <defs>
    <linearGradient id="mark" x1="28" y1="26" x2="186" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171A21"/>
      <stop offset="0.55" stop-color="#343A4A"/>
      <stop offset="1" stop-color="#5B63D3"/>
    </linearGradient>
  </defs>

  <!-- Mark: an open temporal orbit. The offset dot represents the "else" moment. -->
  <g transform="translate(24 20)">
    <path d="M88 18C48 18 18 48 18 88s32 70 70 70c39 0 70-28 74-66"
          fill="none" stroke="url(#mark)" stroke-width="18" stroke-linecap="round"/>
    <path d="M162 92c3-35-20-64-52-72"
          fill="none" stroke="url(#mark)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="143" cy="43" r="10" fill="#5B63D3"/>
  </g>

  <!-- Wordmark -->
  <text x="235" y="132"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="68" font-weight="520" letter-spacing="-2.5" fill="#171A21">Elsewhen</text>
</svg>
