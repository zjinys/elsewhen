[project]
name = "scout"
version = "0.1.0"
description = "Scout: scheduled data collection service (snapshots + diff + findings + read-only API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pydantic>=2.7",
    "tomli-w>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]
executors = [
    "curl-cffi>=0.7",
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
