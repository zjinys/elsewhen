<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Elsewhen Android launcher icon</title>
  <desc id="d">Same orbit mark as the brand icon, scaled so the ring spans ~3/4 of the canvas (Termux-style mark-heavy proportion); background square fills the full canvas (no transparent corners).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24262D"/><stop offset="1" stop-color="#15161B"/>
    </linearGradient>
    <linearGradient id="ring" x1="120" y1="96" x2="400" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4E5568"/><stop offset="0.55" stop-color="#6A6FE0"/><stop offset="1" stop-color="#8A8FF5"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A8FF5" stop-opacity="0.85"/><stop offset="0.45" stop-color="#6A6FE0" stop-opacity="0.30"/><stop offset="1" stop-color="#6A6FE0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 直角满幅背景：Android 启动器自己做圆形/圆角裁切，圆角会在裁切后留下黑角 -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 环外径 338px * 1.136 ≈ 384px = 512 画布的 3/4（Termux 式图形占满风格）。
       halo 光晕外缘 163px < 256 中心半径，不会被 adaptive 遮罩裁到。 -->
  <g transform="translate(256 256) scale(1.136) translate(-256 -256)">
    <path d="M306.6 124.9 A148 148 0 1 0 399.0 225.7" fill="none" stroke="url(#ring)" stroke-width="42" stroke-linecap="round"/>
    <circle cx="326.6" cy="200.4" r="54" fill="url(#halo)"/><circle cx="326.6" cy="200.4" r="24" fill="#A5A9F8"/>
  </g>
</svg>
