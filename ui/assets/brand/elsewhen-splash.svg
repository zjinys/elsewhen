<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 288" role="img" aria-labelledby="t d">
  <title id="t">Elsewhen Android 12 splash icon</title>
  <desc id="d">The shared rounded app icon scaled into Android 12's 192dp inner splash circle, so the system mask never clips its corners or orbit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24262D"/><stop offset="1" stop-color="#15161B"/>
    </linearGradient>
    <linearGradient id="ring" x1="128" y1="128" x2="384" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4E5568"/><stop offset="0.55" stop-color="#6A6FE0"/><stop offset="1" stop-color="#8A8FF5"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A8FF5" stop-opacity="0.85"/><stop offset="0.45" stop-color="#6A6FE0" stop-opacity="0.30"/><stop offset="1" stop-color="#6A6FE0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 288dp canvas, 192dp inner circle. A 150dp rounded tile has its
       farthest corner at ~92dp from center, safely inside the 96dp mask. -->
  <g transform="translate(144 144) scale(0.29296875) translate(-256 -256)">
    <rect width="512" height="512" rx="116" fill="url(#bg)"/>
    <path d="M205.27 445.32 A196 196 0 1 1 445.32 205.27" fill="none" stroke="url(#ring)" stroke-width="44" stroke-linecap="round"/>
    <circle cx="394.59" cy="394.59" r="62" fill="url(#halo)"/>
    <circle cx="394.59" cy="394.59" r="28" fill="#A5A9F8"/>
  </g>
</svg>
