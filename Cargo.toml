[package]
name = "elsewhen"
version = "0.1.0"
edition = "2021"
description = "Local-first personal event recorder with global hotkey capture"
license = "MIT"
default-run = "elsewhen"

[[bin]]
name = "elsewhen"
path = "src/main.rs"

[[bin]]
name = "test_adapter"
path = "test_adapter.rs"

# Flutter bridge library
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
dotenvy = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
iced = { version = "0.14", default-features = true, features = ["svg"] }
rdev = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flutter_rust_bridge = "=2.14.0-beta.2"

[profile.release]
lto = "thin"
strip = true
