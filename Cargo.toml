[package]
name = "elsewhen"
version = "0.1.0"
edition = "2021"
autobins = false
description = "Local-first personal event system (Rust core for the Flutter app)"
license = "MIT"
# Flutter bridge library
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
fontdb = "0.23"
directories = "5"
rusqlite = { version = "0.39", features = ["bundled"] }
# `from-directory`：按官方约定加载 migrations/ 下的 *.sql（配合 include_dir! 编译期嵌入）
rusqlite_migration = { version = "2.5", features = ["from-directory"] }
include_dir = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flutter_rust_bridge = "=2.14.0-beta.2"
tiktoken-rs = "0.7.0"

[profile.release]
lto = "thin"
strip = true
