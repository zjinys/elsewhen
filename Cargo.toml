[package]
name = "elsewhen"
version = "0.1.0"
edition = "2021"
autobins = false
description = "Local-first personal event system (Rust core for the Flutter app)"
license = "MIT"
# Flutter bridge library
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
fontdb = "0.23"
directories = "5"
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flutter_rust_bridge = "=2.14.0-beta.2"

[profile.release]
lto = "thin"
strip = true
