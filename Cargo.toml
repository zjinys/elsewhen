[package]
name = "elsewhen"
version = "0.5.1"
edition = "2024"
autobins = false
description = "Local-first personal event system (Rust core for the Flutter app)"
license = "AGPL-3.0-only"
# Flutter bridge library
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

# Environment mutation tests must run without libtest's worker threads.
[[test]]
name = "config_environment"
harness = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fontdb = "0.23"
directories = "5"
zip = { version = "9", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.39", features = ["bundled"] }
# `from-directory`：按官方约定加载 migrations/ 下的 *.sql（配合 include_dir! 编译期嵌入）
rusqlite_migration = { version = "2.5", features = ["from-directory"] }
include_dir = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
ring = "0.17"
# DoH+ECH（参照 github.com/Lingyan000/fluxdo_doh 重写）：仅外网搜索用，见 src/net_doh/。
# ECH 的 HPKE 只在 aws-lc-rs 下有实现（ring 没有），故 rustls 需开启 aws_lc_rs。
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio-rustls = "0.26"
rustls-pki-types = "1"
webpki-roots = "0.26"
aws-lc-rs = "1"
# 不引入 hickory-resolver：其 0.24 内部锁定 rustls 0.21 / http 0.2 旧依赖，实测连自建
# DoH 服务握手异常（invalid data）。改由 net_doh 用自己的 tls_crypto 手工做 DoH wire-format。
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10"
flutter_rust_bridge = "=2.14.0-beta.2"
tiktoken-rs = "0.7.0"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
# flutter_rust_bridge 的属性宏内部展开出 cfg(frb_expand)（regen 中间态），
# rustc 不认识该 cfg 会告警；在此显式登记为已知条件编译名。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
